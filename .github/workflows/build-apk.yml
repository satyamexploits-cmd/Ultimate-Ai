name: Generate ultimateai.apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Complete ULTIMATE AI Android Project
        run: |
          mkdir -p app/src/main/java/com/ultimateai/app
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UltimateAI"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.ultimateai.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.ultimateai.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.11.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("androidx.security:security-crypto:1.1.0-alpha06")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_ultimate_launcher"
                  android:roundIcon="@drawable/ic_ultimate_launcher"
                  android:label="ULTIMATE AI"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_ultimate_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#141413" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#C86446" android:pathData="M54,22L82,78H66L54,52L42,78H26L54,22Z" />
              <path android:fillColor="#FAF7F2" android:pathData="M54,62L61,78H47L54,62Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/java/com/ultimateai/app/MainActivity.kt
          package com.ultimateai.app

          import android.content.Context
          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import android.webkit.WebView
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalClipboardManager
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          data class ChatMessage(val id: String, val role: String, val text: String, val model: String)
          data class ProviderConfig(val id: String, val name: String, val baseUrl: String, val defaultModel: String, val presets: List<String>)

          val PROVIDERS = listOf(
              ProviderConfig(
                  "openrouter",
                  "OpenRouter (All Flagships)",
                  "https://openrouter.ai/api/v1",
                  "anthropic/claude-opus-4",
                  listOf("anthropic/claude-opus-4", "anthropic/claude-3.7-sonnet:thinking", "google/gemini-2.5-pro", "openai/gpt-4o", "deepseek/deepseek-r1")
              ),
              ProviderConfig(
                  "gemini",
                  "Google AI Studio (Gemini)",
                  "https://generativelanguage.googleapis.com/v1beta/openai",
                  "gemini-2.5-pro",
                  listOf("gemini-2.5-pro", "gemini-2.5-flash")
              ),
              ProviderConfig(
                  "openai",
                  "OpenAI Direct",
                  "https://api.openai.com/v1",
                  "gpt-4o",
                  listOf("gpt-4o", "o3-mini")
              )
          )

          val DESIGN_WORKFLOWS = listOf(
              "1. Brief Framing" to "Design Specification",
              "2. Design System Setup & Binding" to "Token Bundle",
              "3. Design System Specimen Showcase" to "HTML/CSS Preview",
              "4. Design System Guardian" to "Drift Audit",
              "5. Brand Identity Board" to "Identity Spec",
              "6. Prompt-to-Screen Generator" to "Compose + HTML Handoff",
              "7. Prompt-to-Flow (Multi-Screen)" to "Flow Spec",
              "8. Reusable Component Library" to "Component Inventory",
              "9. UI Hierarchy & Layout Audit" to "Audit Report",
              "10. Visual Originality Audit" to "Anti-Cliché Report",
              "11. Polish Pass" to "Refinement Handoff",
              "12. Text Integrity Audit" to "Copy Audit",
              "13. Mobile-First & Touch-Target Audit" to "Mobile Audit",
              "14. Accessibility Advisory Checklist" to "Advisory Checklist",
              "15. Tailwind / Token Audit" to "Token Audit",
              "16. Framework Handoff (Compose / React)" to "Code Handoff",
              "17. Brand Collateral & Pitch Outline" to "Collateral Spec"
          )

          class MainActivity : ComponentActivity() {
              private var tts: TextToSpeech? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  tts = TextToSpeech(this) { if (it == TextToSpeech.SUCCESS) tts?.language = Locale.US }
                  setContent {
                      val dark = isSystemInDarkTheme()
                      val scheme = if (dark) {
                          darkColorScheme(
                              primary = Color(0xFFD97757),
                              background = Color(0xFF141413),
                              surface = Color(0xFF252422),
                              surfaceVariant = Color(0xFF1E1D1B),
                              onBackground = Color(0xFFF4F1EA),
                              onSurface = Color(0xFFF4F1EA)
                          )
                      } else {
                          lightColorScheme(
                              primary = Color(0xFFC86446),
                              background = Color(0xFFFAF7F2),
                              surface = Color(0xFFFFFFFF),
                              surfaceVariant = Color(0xFFF3EFE6),
                              onBackground = Color(0xFF191816),
                              onSurface = Color(0xFF191816)
                          )
                      }
                      MaterialTheme(colorScheme = scheme) {
                          UltimateAiScreen(onSpeak = { tts?.speak(it.take(1500), TextToSpeech.QUEUE_FLUSH, null, "tts") })
                      }
                  }
              }

              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }

          private fun encryptedPrefs(context: Context) = EncryptedSharedPreferences.create(
              context,
              "ultimate_ai_vault",
              MasterKey.Builder(context).setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build(),
              EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
              EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
          )

          @Composable
          fun UltimateAiScreen(onSpeak: (String) -> Unit) {
              val context = LocalContext.current
              val prefs = remember { encryptedPrefs(context) }
              val scope = rememberCoroutineScope()
              val clipboard = LocalClipboardManager.current
              val httpClient = remember {
                  OkHttpClient.Builder()
                      .connectTimeout(20, TimeUnit.SECONDS)
                      .readTimeout(120, TimeUnit.SECONDS)
                      .build()
              }

              var currentTab by remember { mutableIntStateOf(0) }
              var selectedProvider by remember { mutableStateOf(PROVIDERS.first()) }
              var selectedModel by remember { mutableStateOf(PROVIDERS.first().defaultModel) }
              var messages by remember { mutableStateOf(listOf<ChatMessage>()) }
              var streamingText by remember { mutableStateOf("") }
              var isStreaming by remember { mutableStateOf(false) }
              var statusBanner by remember { mutableStateOf<String?>(null) }
              var streamJob by remember { mutableStateOf<Job?>(null) }

              var codeFileContent by remember {
                  mutableStateOf("package com.ultimateai.workspace\n\nclass AgentTask {\n    fun execute() = \"Ready\"\n}")
              }
              var proposedCodeContent by remember { mutableStateOf<String?>(null) }

              fun sendStreamingMessage(userPrompt: String, sysPrompt: String = "You are ULTIMATE AI, an elite software architect, researcher, and designer.") {
                  val trimmed = userPrompt.trim()
                  if (trimmed.isEmpty() || isStreaming) return
                  val apiKey = prefs.getString("key_${selectedProvider.id}", null)
                  if (apiKey.isNullOrBlank()) {
                      statusBanner = "API key missing for ${selectedProvider.name}. Save your key in the Providers tab."
                      currentTab = 3
                      return
                  }

                  val userMsg = ChatMessage(System.currentTimeMillis().toString(), "user", trimmed, selectedModel)
                  messages = messages + userMsg
                  isStreaming = true
                  streamingText = ""
                  statusBanner = null

                  streamJob = scope.launch(Dispatchers.IO) {
                      try {
                          val msgArray = JSONArray().apply {
                              put(JSONObject().put("role", "system").put("content", sysPrompt))
                              messages.forEach { m ->
                                  put(JSONObject().put("role", m.role).put("content", m.text))
                              }
                          }
                          val bodyJson = JSONObject()
                              .put("model", selectedModel)
                              .put("stream", true)
                              .put("messages", msgArray)

                          val req = Request.Builder()
                              .url("${selectedProvider.baseUrl.trimEnd('/')}/chat/completions")
                              .header("Authorization", "Bearer $apiKey")
                              .header("Content-Type", "application/json")
                              .header("Accept", "text/event-stream")
                              .post(bodyJson.toString().toRequestBody("application/json".toMediaType()))
                              .build()

                          val accumulated = StringBuilder()
                          httpClient.newCall(req).execute().use { resp ->
                              if (!resp.isSuccessful) {
                                  withContext(Dispatchers.Main) {
                                      statusBanner = "${selectedProvider.name} error (HTTP ${resp.code}). Check API key or model ID."
                                      isStreaming = false
                                  }
                                  return@use
                              }
                              val reader: BufferedReader = resp.body?.charStream()?.buffered() ?: return@use
                              var line: String?
                              while (reader.readLine().also { line = it } != null) {
                                  val clean = line?.trim() ?: continue
                                  if (!clean.startsWith("data:")) continue
                                  val payload = clean.removePrefix("data:").trim()
                                  if (payload == "[DONE]") break
                                  try {
                                      val obj = JSONObject(payload)
                                      val choices = obj.optJSONArray("choices")
                                      if (choices != null && choices.length() > 0) {
                                          val delta = choices.getJSONObject(0).optJSONObject("delta")
                                          val chunk = delta?.optString("content", "") ?: ""
                                          if (chunk.isNotEmpty()) {
                                              accumulated.append(chunk)
                                              val snap = accumulated.toString()
                                              withContext(Dispatchers.Main) { streamingText = snap }
                                          }
                                      }
                                  } catch (_: Exception) {}
                              }
                          }
                          withContext(Dispatchers.Main) {
                              if (accumulated.isNotEmpty()) {
                                  messages = messages + ChatMessage(
                                      System.currentTimeMillis().toString(),
                                      "assistant",
                                      accumulated.toString(),
                                      selectedModel
                                  )
                              }
                              isStreaming = false
                              streamingText = ""
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) {
                              statusBanner = "Stream stopped or interrupted."
                              isStreaming = false
                          }
                      }
                  }
              }

              Scaffold(
                  topBar = {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(MaterialTheme.colorScheme.surfaceVariant)
                              .padding(horizontal = 16.dp, vertical = 10.dp)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column {
                                  Text("ULTIMATE AI", style = MaterialTheme.typography.titleLarge)
                                  Text("${selectedProvider.name} • $selectedModel", style = MaterialTheme.typography.labelSmall)
                              }
                              IconButton(onClick = {
                                  streamJob?.cancel()
                                  isStreaming = false
                                  messages = emptyList()
                              }) {
                                  Icon(Icons.Default.AddComment, contentDescription = "New Chat")
                              }
                          }
                          statusBanner?.let {
                              Spacer(Modifier.height(4.dp))
                              Text(it, color = MaterialTheme.colorScheme.primary, style = MaterialTheme.typography.bodySmall)
                          }
                      }
                  },
                  bottomBar = {
                      NavigationBar {
                          listOf(
                              "Chat" to Icons.Default.ChatBubbleOutline,
                              "Coding" to Icons.Default.Code,
                              "Design" to Icons.Default.Palette,
                              "Providers" to Icons.Default.Key
                          ).forEachIndexed { idx, pair ->
                              NavigationBarItem(
                                  selected = currentTab == idx,
                                  onClick = { currentTab = idx },
                                  icon = { Icon(pair.second, contentDescription = pair.first) },
                                  label = { Text(pair.first) }
                              )
                          }
                      }
                  }
              ) { padding ->
                  Box(modifier = Modifier.fillMaxSize().padding(padding)) {
                      when (currentTab) {
                          0 -> {
                              var draft by remember { mutableStateOf("") }
                              Column(modifier = Modifier.fillMaxSize()) {
                                  LazyColumn(
                                      modifier = Modifier.weight(1f).fillMaxWidth().padding(16.dp),
                                      verticalArrangement = Arrangement.spacedBy(10.dp)
                                  ) {
                                      if (messages.isEmpty() && !isStreaming) {
                                          item {
                                              Text(
                                                  "ULTIMATE AI Ready.\nSelect a model in Providers, start chatting, or run a 17-workflow Design Studio task.",
                                                  style = MaterialTheme.typography.bodyLarge
                                              )
                                          }
                                      }
                                      items(messages, key = { it.id }) { m ->
                                          Card(
                                              modifier = Modifier.fillMaxWidth(),
                                              shape = RoundedCornerShape(12.dp)
                                          ) {
                                              Column(modifier = Modifier.padding(12.dp)) {
                                                  Row(
                                                      modifier = Modifier.fillMaxWidth(),
                                                      horizontalArrangement = Arrangement.SpaceBetween
                                                  ) {
                                                      Text(
                                                          if (m.role == "user") "You" else "ULTIMATE AI (${m.model})",
                                                          style = MaterialTheme.typography.labelSmall
                                                      )
                                                      Row {
                                                          if (m.role == "assistant") {
                                                              TextButton(onClick = { onSpeak(m.text) }) { Text("Speak") }
                                                          }
                                                          TextButton(onClick = { clipboard.setText(AnnotatedString(m.text)) }) { Text("Copy") }
                                                      }
                                                  }
                                                  Text(m.text, style = MaterialTheme.typography.bodyMedium)
                                              }
                                          }
                                      }
                                      if (isStreaming) {
                                          item {
                                              Card(modifier = Modifier.fillMaxWidth()) {
                                                  Column(modifier = Modifier.padding(12.dp)) {
                                                      Text("Streaming ($selectedModel)...", color = MaterialTheme.colorScheme.primary)
                                                      Text(streamingText.ifEmpty { "..." })
                                                  }
                                              }
                                          }
                                      }
                                  }
                                  Row(
                                      modifier = Modifier.fillMaxWidth().padding(12.dp),
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      OutlinedTextField(
                                          value = draft,
                                          onValueChange = { draft = it },
                                          modifier = Modifier.weight(1f),
                                          placeholder = { Text("Ask ULTIMATE AI...") }
                                      )
                                      if (isStreaming) {
                                          Button(onClick = {
                                              streamJob?.cancel()
                                              isStreaming = false
                                          }) { Text("Stop") }
                                      } else {
                                          Button(onClick = {
                                              sendStreamingMessage(draft)
                                              draft = ""
                                          }) { Text("Send") }
                                      }
                                  }
                              }
                          }
                          1 -> {
                              var editDraft by remember(codeFileContent) { mutableStateOf(codeFileContent) }
                              LazyColumn(
                                  modifier = Modifier.fillMaxSize().padding(16.dp),
                                  verticalArrangement = Arrangement.spacedBy(12.dp)
                              ) {
                                  item {
                                      Text("Standalone Coding & Diff Workspace", style = MaterialTheme.typography.titleLarge)
                                      OutlinedTextField(
                                          value = editDraft,
                                          onValueChange = { editDraft = it },
                                          modifier = Modifier.fillMaxWidth(),
                                          minLines = 8,
                                          label = { Text("Workspace Source Editor") }
                                      )
                                      Spacer(Modifier.height(8.dp))
                                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                          Button(onClick = { proposedCodeContent = editDraft }) { Text("Stage Diff") }
                                          OutlinedButton(onClick = {
                                              sendStreamingMessage("Review and refactor this Kotlin code:\n```kotlin\n$editDraft\n```")
                                              currentTab = 0
                                          }) { Text("AI Code Review") }
                                      }
                                  }
                                  proposedCodeContent?.let { prop ->
                                      item {
                                          Card(modifier = Modifier.fillMaxWidth()) {
                                              Column(modifier = Modifier.padding(12.dp)) {
                                                  Text("Staged Diff Preview", style = MaterialTheme.typography.titleMedium)
                                                  Text("- $codeFileContent\n+ $prop", fontFamily = FontFamily.Monospace)
                                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                                      Button(onClick = {
                                                          codeFileContent = prop
                                                          proposedCodeContent = null
                                                      }) { Text("Approve & Apply") }
                                                      OutlinedButton(onClick = { proposedCodeContent = null }) { Text("Reject") }
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                          2 -> {
                              var brief by remember { mutableStateOf("Warm editorial fintech mobile app with clear hierarchy") }
                              var selectedWf by remember { mutableIntStateOf(0) }
                              var showPreview by remember { mutableStateOf(false) }

                              LazyColumn(
                                  modifier = Modifier.fillMaxSize().padding(16.dp),
                                  verticalArrangement = Arrangement.spacedBy(10.dp)
                              ) {
                                  item {
                                      Text("Design Studio (17 Workflows)", style = MaterialTheme.typography.titleLarge)
                                      OutlinedTextField(
                                          value = brief,
                                          onValueChange = { brief = it },
                                          modifier = Modifier.fillMaxWidth(),
                                          minLines = 3,
                                          label = { Text("Design Brief / Screen Prompt") }
                                      )
                                      Spacer(Modifier.height(8.dp))
                                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                          Button(onClick = {
                                              val wf = DESIGN_WORKFLOWS[selectedWf]
                                              sendStreamingMessage(
                                                  "[Design Studio: ${wf.first} | Output: ${wf.second}]\n$brief",
                                                  "You are the ULTIMATE AI Design Studio Engine. Enforce >=48dp touch targets, warm editorial hierarchy, and zero placeholder Lorem Ipsum."
                                              )
                                              currentTab = 0
                                          }) { Text("Run Workflow") }
                                          OutlinedButton(onClick = { showPreview = !showPreview }) {
                                              Text(if (showPreview) "Hide Specimen" else "Live Specimen")
                                          }
                                      }
                                  }
                                  if (showPreview) {
                                      item {
                                          val html = "<html><body style='background:#FAF7F2;color:#191816;font-family:sans-serif;padding:16px;'><span style='background:#C86446;color:#fff;padding:4px 8px;border-radius:6px;font-size:12px;'>Warm Editorial Specimen</span><h2>${brief.take(36)}</h2><div style='display:flex;gap:8px;'><div style='flex:1;height:32px;background:#FAF7F2;border:1px solid #ccc;'></div><div style='flex:1;height:32px;background:#191816;'></div><div style='flex:1;height:32px;background:#C86446;'></div></div></body></html>"
                                          Box(modifier = Modifier.fillMaxWidth().height(180.dp)) {
                                              AndroidView(factory = { ctx ->
                                                  WebView(ctx).apply {
                                                      settings.javaScriptEnabled = false
                                                      loadDataWithBaseURL(null, html, "text/html", "UTF-8", null)
                                                  }
                                              }, modifier = Modifier.fillMaxSize())
                                          }
                                      }
                                  }
                                  items(DESIGN_WORKFLOWS.size) { idx ->
                                      val wf = DESIGN_WORKFLOWS[idx]
                                      Row(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .clickable { selectedWf = idx }
                                              .padding(vertical = 6.dp),
                                          horizontalArrangement = Arrangement.SpaceBetween,
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Column(modifier = Modifier.weight(1f)) {
                                              Text(wf.first, style = MaterialTheme.typography.bodyLarge)
                                              Text("Badge: ${wf.second}", style = MaterialTheme.typography.labelSmall)
                                          }
                                          RadioButton(selected = selectedWf == idx, onClick = { selectedWf = idx })
                                      }
                                  }
                              }
                          }
                          3 -> {
                              var keyInput by remember { mutableStateOf("") }
                              var modelInput by remember(selectedModel) { mutableStateOf(selectedModel) }
                              val savedKey = prefs.getString("key_${selectedProvider.id}", null)
                              val masked = if (savedKey.isNullOrBlank()) "Not configured" else "••••••••" + savedKey.takeLast(4)

                              LazyColumn(
                                  modifier = Modifier.fillMaxSize().padding(16.dp),
                                  verticalArrangement = Arrangement.spacedBy(12.dp)
                              ) {
                                  item {
                                      Text("Providers & Keystore Vault", style = MaterialTheme.typography.titleLarge)
                                      Text("Keys are encrypted with Android Keystore AES-256-GCM.", style = MaterialTheme.typography.bodySmall)
                                  }
                                  items(PROVIDERS) { p ->
                                      Row(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .clickable {
                                                  selectedProvider = p
                                                  selectedModel = p.defaultModel
                                              }
                                              .padding(vertical = 8.dp),
                                          horizontalArrangement = Arrangement.SpaceBetween,
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Column(modifier = Modifier.weight(1f)) {
                                              Text(p.name, style = MaterialTheme.typography.titleMedium)
                                              Text(p.baseUrl, style = MaterialTheme.typography.labelSmall)
                                          }
                                          RadioButton(
                                              selected = p.id == selectedProvider.id,
                                              onClick = {
                                                  selectedProvider = p
                                                  selectedModel = p.defaultModel
                                              }
                                          )
                                      }
                                  }
                                  item {
                                      LazyRow(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                          items(selectedProvider.presets) { preset ->
                                              FilterChip(
                                                  selected = selectedModel == preset,
                                                  onClick = {
                                                      selectedModel = preset
                                                      modelInput = preset
                                                  },
                                                  label = { Text(preset) }
                                              )
                                          }
                                      }
                                      Spacer(Modifier.height(8.dp))
                                      Text("Saved Key (${selectedProvider.name}): $masked")
                                      OutlinedTextField(
                                          value = keyInput,
                                          onValueChange = { keyInput = it },
                                          visualTransformation = PasswordVisualTransformation(),
                                          label = { Text("Enter API Key for ${selectedProvider.name}") },
                                          modifier = Modifier.fillMaxWidth()
                                      )
                                      Spacer(Modifier.height(8.dp))
                                      OutlinedTextField(
                                          value = modelInput,
                                          onValueChange = {
                                              modelInput = it
                                              selectedModel = it
                                          },
                                          label = { Text("Model ID") },
                                          modifier = Modifier.fillMaxWidth()
                                      )
                                      Spacer(Modifier.height(8.dp))
                                      Button(onClick = {
                                          if (keyInput.isNotBlank()) {
                                              prefs.edit().putString("key_${selectedProvider.id}", keyInput.trim()).apply()
                                              keyInput = ""
                                              statusBanner = "API key encrypted and saved for ${selectedProvider.name}."
                                          }
                                      }) {
                                          Text("Save Encrypted API Key")
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Compile Installable ultimateai.apk
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ultimateai.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose ultimateai.apk
          sha256sum ultimateai.apk | tee ultimateai.apk.sha256

      - name: Upload ultimateai.apk for 1-Click Download
        uses: actions/upload-artifact@v4
        with:
          name: ultimateai-apk
          path: |
            ultimateai.apk
            ultimateai.apk.sha256
